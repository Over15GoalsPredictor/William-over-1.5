
name: Build Over 1.5 Predictor APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q Over15GoalsPredictor_Android_Starter.zip -d project

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if 'jvmTarget = "17"' not in s:
              i = s.rfind("}")
              if i < 0:
                  raise SystemExit("Android configuration block not found")

              settings = """
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              s = s[:i] + settings + "\n" + s[i:]
              p.write_text(s)

          print("Java and Kotlin JVM target configuration checked.")
          PY

      - name: Build APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Over15GoalsPredictor-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
